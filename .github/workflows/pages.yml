name: Deploy Public Static Site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build & Validate Public Showcase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Validate Public Static Site Artifacts
        run: |
          echo "Verifying public site directory structure..."
          test -d website || { echo "❌ website directory missing"; exit 1; }
          test -f website/index.html || { echo "❌ website/index.html missing"; exit 1; }
          test -f website/css/style.css || { echo "❌ website/css/style.css missing"; exit 1; }
          test -f website/js/main.js || { echo "❌ website/js/main.js missing"; exit 1; }
          test -f website/assets/favicon.png || { echo "❌ favicon asset missing"; exit 1; }
          echo "✅ All public site files validated."

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
